name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    env:
      TASKFORGE_GUMROAD_SUPPORTER_PRODUCT_ID: ${{ vars.TASKFORGE_GUMROAD_SUPPORTER_PRODUCT_ID }}
      TASKFORGE_GUMROAD_PRO_PRODUCT_ID: ${{ vars.TASKFORGE_GUMROAD_PRO_PRODUCT_ID }}
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install dependencies
        run: python -m pip install -r requirements.txt pyinstaller pillow
      - name: Unit tests
        run: python -m unittest discover -s tests -v
      - name: Safe UI self-test
        run: python run.py --selftest
      - name: Build all editions
        shell: powershell
        run: ./build.ps1
      - name: Stage public editions only
        shell: powershell
        run: |
          New-Item -ItemType Directory -Force public | Out-Null
          $version = "2.4.0-beta.1"
          foreach ($edition in @("Free", "Free-with-Ads")) {
            $name = "TaskForge-$version-$edition"
            New-Item -ItemType Directory -Force "stage/$name" | Out-Null
            Copy-Item "dist/TaskForge-$version/$name.exe" "stage/$name/"
            Copy-Item README.md,LICENSING.md,PRIVACY.md,SECURITY.md "stage/$name/"
            Compress-Archive "stage/$name/*" "public/$name.zip"
          }
          Get-FileHash public/*.zip -Algorithm SHA256 |
            ForEach-Object { "$($_.Hash.ToLower())  $([IO.Path]::GetFileName($_.Path))" } |
            Set-Content -Encoding ASCII public/SHA256SUMS.txt
      - uses: sigstore/cosign-installer@v3
      - name: Keyless Sigstore bundles
        shell: powershell
        run: |
          Get-ChildItem public/*.zip | ForEach-Object {
            cosign sign-blob --yes --bundle "$($_.FullName).sigstore.json" $_.FullName
          }
      - name: Attest public binaries
        uses: actions/attest-build-provenance@v2
        with:
          subject-path: "public/*.zip"
      - name: Publish GitHub release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "${{ github.ref_name }}" public/* --verify-tag --notes-file BETA_RELEASE_NOTES.md --prerelease --title "TaskForge 2.4.0 Beta 1"
